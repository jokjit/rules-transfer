name: 编译规则集

on:
  workflow_dispatch:
    inputs:
      rule_url:
        description: "可选：新规则链接（JSON/YAML）"
        required: false
        type: string
      rule_name:
        description: "可选：规则名称（不含扩展名）"
        required: false
        type: string
      rule_format:
        description: "规则格式（json→srs / yaml→mrs）"
        required: false
        default: "json"
        type: choice
        options:
          - json
          - yaml
      rule_type:
        description: "YAML 规则类型"
        required: false
        default: "domain"
        type: choice
        options:
          - domain
          - ipcidr
          - classical

  schedule:
    - cron: "0 0 * * *"

  push:
    paths:
      - "rules/**"
      - ".github/workflows/compile.yml"

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest

    env:
      EVENT_NAME: ${{ github.event_name }}
      INPUT_URL: ${{ github.event.inputs.rule_url }}
      INPUT_NAME: ${{ github.event.inputs.rule_name }}
      INPUT_FORMAT: ${{ github.event.inputs.rule_format || 'json' }}
      INPUT_TYPE: ${{ github.event.inputs.rule_type || 'domain' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update -q
          sudo apt-get install -y \
            jq \
            curl \
            wget \
            git \
            python3-yaml

          mkdir -p rules output

      - name: Update sources.json
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.rule_url != '' }}
        run: |
          set -e

          if [ ! -f "rules/sources.json" ]; then
            echo "[]" > rules/sources.json
          fi

          if [ -z "$INPUT_NAME" ]; then
            echo "::error::填写规则链接时必须同时填写规则名称"
            exit 1
          fi

          normalize_url() {
            local url="$1"

            if [[ "$url" =~ ^https://github\.com/([^/]+)/([^/]+)/blob/(.+)$ ]]; then
              echo "https://raw.githubusercontent.com/${BASH_REMATCH[1]}/${BASH_REMATCH[2]}/${BASH_REMATCH[3]}"
            elif [[ "$url" =~ ^https://github\.com/([^/]+)/([^/]+)/raw/(.+)$ ]]; then
              echo "https://raw.githubusercontent.com/${BASH_REMATCH[1]}/${BASH_REMATCH[2]}/${BASH_REMATCH[3]}"
            else
              echo "$url"
            fi
          }

          INPUT_URL="$(normalize_url "$INPUT_URL")"

          if ! jq empty rules/sources.json; then
            echo "::error::rules/sources.json 不是有效 JSON"
            exit 1
          fi

          if [ "$(jq -r 'type' rules/sources.json)" != "array" ]; then
            echo "::error::rules/sources.json 顶层必须是数组"
            exit 1
          fi

          if [ "$INPUT_FORMAT" = "yaml" ]; then
            ENTRY="$(
              jq -n \
                --arg name "$INPUT_NAME" \
                --arg url "$INPUT_URL" \
                --arg format "$INPUT_FORMAT" \
                --arg type "$INPUT_TYPE" \
                '{
                  name: $name,
                  url: $url,
                  format: $format,
                  type: $type
                }'
            )"
          else
            ENTRY="$(
              jq -n \
                --arg name "$INPUT_NAME" \
                --arg url "$INPUT_URL" \
                --arg format "$INPUT_FORMAT" \
                '{
                  name: $name,
                  url: $url,
                  format: $format
                }'
            )"
          fi

          jq \
            --arg name "$INPUT_NAME" \
            --argjson entry "$ENTRY" \
            'if any(.[]; .name == $name)
             then map(if .name == $name then $entry else . end)
             else . + [$entry]
             end' \
            rules/sources.json > rules/sources.json.tmp

          mv rules/sources.json.tmp rules/sources.json

          echo "已更新 rules/sources.json"
          echo "名称：$INPUT_NAME"
          echo "格式：$INPUT_FORMAT"
          echo "地址：$INPUT_URL"

      - name: Download rules
        run: |
          set -e

          mkdir -p rules output

          if [ ! -f "rules/sources.json" ]; then
            echo "rules/sources.json 不存在，跳过远程下载"
            exit 0
          fi

          if ! jq empty rules/sources.json; then
            echo "::error::rules/sources.json 不是有效 JSON"
            exit 1
          fi

          if [ "$(jq -r 'type' rules/sources.json)" != "array" ]; then
            echo "::error::rules/sources.json 顶层必须是数组"
            exit 1
          fi

          normalize_url() {
            local url="$1"

            if [[ "$url" =~ ^https://github\.com/([^/]+)/([^/]+)/blob/(.+)$ ]]; then
              echo "https://raw.githubusercontent.com/${BASH_REMATCH[1]}/${BASH_REMATCH[2]}/${BASH_REMATCH[3]}"
            elif [[ "$url" =~ ^https://github\.com/([^/]+)/([^/]+)/raw/(.+)$ ]]; then
              echo "https://raw.githubusercontent.com/${BASH_REMATCH[1]}/${BASH_REMATCH[2]}/${BASH_REMATCH[3]}"
            else
              echo "$url"
            fi
          }

          if [ "$(jq 'length' rules/sources.json)" -eq 0 ]; then
            echo "rules/sources.json 为空，跳过远程下载"
            exit 0
          fi

          while IFS= read -r item; do
            name="$(jq -r '.name // empty' <<< "$item")"
            url="$(jq -r '.url // empty' <<< "$item")"
            format="$(jq -r '.format // "json"' <<< "$item")"

            if [ -z "$name" ] || [ -z "$url" ]; then
              echo "::warning::跳过缺少 name 或 url 的项目"
              continue
            fi

            case "$format" in
              json|yaml|yml)
                ;;
              *)
                echo "::warning::跳过不支持的格式：$name ($format)"
                continue
                ;;
            esac

            url="$(normalize_url "$url")"
            destination="rules/${name}.${format}"
            temporary="${destination}.download"

            echo "正在下载：$name"
            echo "下载地址：$url"

            rm -f "$temporary"

            if ! curl -fL \
              --retry 3 \
              --retry-all-errors \
              --connect-timeout 20 \
              --max-time 120 \
              --output "$temporary" \
              "$url"; then
              echo "::warning::下载失败，保留已有文件：$name"
              rm -f "$temporary"
              continue
            fi

            if [ ! -s "$temporary" ]; then
              echo "::warning::下载结果为空，保留已有文件：$name"
              rm -f "$temporary"
              continue
            fi

            if head -c 500 "$temporary" | grep -Eiq \
              '<!DOCTYPE html|<html|<head|access denied|404: not found'; then
              echo "::warning::下载结果是网页，保留已有文件：$name"
              rm -f "$temporary"
              continue
            fi

            mv "$temporary" "$destination"
            echo "下载完成：$destination"
          done < <(jq -c '.[]' rules/sources.json)

      - name: Download sing-box
        run: |
          set -e

          get_latest_stable_tag() {
            local repository="$1"

            git ls-remote --tags --refs \
              "https://github.com/${repository}.git" \
              | sed 's#^.*/##' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n 1
          }

          TAG="$(get_latest_stable_tag "SagerNet/sing-box")"

          if [ -z "$TAG" ]; then
            echo "::error::无法获取 sing-box 最新稳定版本"
            exit 1
          fi

          VERSION="${TAG#v}"
          DIRECTORY="sing-box-${VERSION}-linux-amd64"
          ARCHIVE="${DIRECTORY}.tar.gz"
          URL="https://github.com/SagerNet/sing-box/releases/download/${TAG}/${ARCHIVE}"

          echo "sing-box 标签：$TAG"
          echo "sing-box 版本：$VERSION"
          echo "下载地址：$URL"

          rm -f "$ARCHIVE"
          rm -rf "$DIRECTORY"

          curl -fL \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 180 \
            --output "$ARCHIVE" \
            "$URL"

          if [ ! -s "$ARCHIVE" ]; then
            echo "::error::sing-box 下载结果为空"
            exit 1
          fi

          tar -xzf "$ARCHIVE"

          BINARY="${DIRECTORY}/sing-box"

          if [ ! -f "$BINARY" ]; then
            echo "::error::sing-box 解压后未找到可执行文件"
            echo "压缩包内容："
            tar -tzf "$ARCHIVE" | head -n 50
            exit 1
          fi

          sudo install -m 0755 \
            "$BINARY" \
            /usr/local/bin/sing-box

          sing-box version

      - name: Download mihomo
        run: |
          set -e

          get_latest_stable_tag() {
            local repository="$1"

            git ls-remote --tags --refs \
              "https://github.com/${repository}.git" \
              | sed 's#^.*/##' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n 1
          }

          TAG="$(get_latest_stable_tag "MetaCubeX/mihomo")"

          if [ -z "$TAG" ]; then
            echo "::error::无法获取 mihomo 最新稳定版本"
            exit 1
          fi

          ARCHIVE="mihomo-linux-amd64-${TAG}.gz"
          BINARY="mihomo-linux-amd64-${TAG}"
          URL="https://github.com/MetaCubeX/mihomo/releases/download/${TAG}/${ARCHIVE}"

          echo "mihomo 标签：$TAG"
          echo "下载地址：$URL"

          rm -f "$ARCHIVE" "$BINARY"

          curl -fL \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 180 \
            --output "$ARCHIVE" \
            "$URL"

          if [ ! -s "$ARCHIVE" ]; then
            echo "::error::mihomo 下载结果为空"
            exit 1
          fi

          gzip -d "$ARCHIVE"

          if [ ! -f "$BINARY" ]; then
            echo "::error::mihomo 解压后未找到可执行文件"
            ls -la
            exit 1
          fi

          sudo install -m 0755 \
            "$BINARY" \
            /usr/local/bin/mihomo

          mihomo -v

      - name: Compile rules
        run: |
          set -e

          mkdir -p output
          HAS_ERROR=0
          FOUND=0

          cat > compile_yaml.py <<'PYEOF'
          import os
          import re
          import subprocess
          import sys

          import yaml


          name, source, output_directory = sys.argv[1:4]

          with open(source, "r", encoding="utf-8") as file:
              document = yaml.safe_load(file) or {}

          if isinstance(document, dict):
              payload = document.get("payload") or []
          elif isinstance(document, list):
              payload = document
          else:
              payload = []

          payload = [
              str(item).strip()
              for item in payload
              if str(item).strip()
          ]

          domain_exact_pattern = re.compile(
              r"^DOMAIN,([^,]+)$",
              re.IGNORECASE,
          )
          domain_suffix_pattern = re.compile(
              r"^DOMAIN-SUFFIX,([^,]+)$",
              re.IGNORECASE,
          )
          ip_cidr_pattern = re.compile(
              r"^(?:IP-CIDR|IP-CIDR6),([^,]+)(?:,no-resolve)?$",
              re.IGNORECASE,
          )

          domain_rules = []
          ip_cidr_rules = []
          classical_rules = []

          for rule in payload:
              match = domain_exact_pattern.match(rule)
              if match:
                  domain_rules.append(match.group(1))
                  continue

              match = domain_suffix_pattern.match(rule)
              if match:
                  domain_rules.append("+." + match.group(1))
                  continue

              match = ip_cidr_pattern.match(rule)
              if match:
                  ip_cidr_rules.append(match.group(1))
                  continue

              classical_rules.append(rule)

          domain_rules = sorted(set(domain_rules))
          ip_cidr_rules = sorted(set(ip_cidr_rules))
          classical_rules = list(dict.fromkeys(classical_rules))


          def compile_mrs(rules, behavior, destination):
              if not rules:
                  return True

              temporary = destination + ".source.yaml"

              with open(temporary, "w", encoding="utf-8") as file:
                  yaml.safe_dump(
                      {"payload": rules},
                      file,
                      allow_unicode=True,
                      sort_keys=False,
                  )

              result = subprocess.run(
                  [
                      "mihomo",
                      "convert-ruleset",
                      behavior,
                      "yaml",
                      temporary,
                      destination,
                  ],
                  capture_output=True,
                  text=True,
              )

              try:
                  os.remove(temporary)
              except OSError:
                  pass

              if result.returncode != 0:
                  error = result.stderr.strip() or result.stdout.strip()
                  print(
                      f"::error::[{name}] {behavior} 转换失败："
                      f"{error[:500]}",
                      file=sys.stderr,
                  )
                  return False

              print(
                  f"已生成 {os.path.basename(destination)}，"
                  f"共 {len(rules)} 条"
              )
              return True


          success = True

          domain_output = os.path.join(
              output_directory,
              f"{name}.mrs",
          )
          ip_cidr_output = os.path.join(
              output_directory,
              f"{name}-ipcidr.mrs",
          )
          classical_output = os.path.join(
              output_directory,
              f"{name}-classical.yaml",
          )

          if domain_rules:
              success = compile_mrs(
                  domain_rules,
                  "domain",
                  domain_output,
              ) and success

          if ip_cidr_rules:
              success = compile_mrs(
                  ip_cidr_rules,
                  "ipcidr",
                  ip_cidr_output,
              ) and success

          if classical_rules:
              with open(classical_output, "w", encoding="utf-8") as file:
                  yaml.safe_dump(
                      {"payload": classical_rules},
                      file,
                      allow_unicode=True,
                      sort_keys=False,
                  )

              print(
                  f"::warning::[{name}] "
                  f"{len(classical_rules)} 条规则已保存到 "
                  f"{name}-classical.yaml"
              )

          if not domain_rules and not ip_cidr_rules and not classical_rules:
              print(
                  f"::error::[{name}] 没有找到有效规则",
                  file=sys.stderr,
              )
              success = False

          sys.exit(0 if success else 1)
          PYEOF

          while IFS= read -r -d '' source; do
            filename="$(basename "$source")"

            if [ "$filename" = "sources.json" ]; then
              echo "跳过配置文件：$filename"
              continue
            fi

            FOUND=1
            extension="${filename##*.}"
            name="${filename%.*}"

            case "$extension" in
              json)
                destination="output/${name}.srs"

                echo "正在编译 sing-box 规则：$filename"
                rm -f "$destination"

                if sing-box rule-set compile \
                  --output "$destination" \
                  "$source"; then
                  echo "已生成：$destination"
                else
                  echo "::error::JSON 编译失败：$filename"
                  HAS_ERROR=1
                fi
                ;;

              yaml|yml)
                echo "正在编译 mihomo 规则：$filename"

                rm -f \
                  "output/${name}.mrs" \
                  "output/${name}-ipcidr.mrs" \
                  "output/${name}-classical.yaml"

                if python3 compile_yaml.py \
                  "$name" \
                  "$source" \
                  "output"; then
                  echo "YAML 处理完成：$filename"
                else
                  echo "::error::YAML 编译失败：$filename"
                  HAS_ERROR=1
                fi
                ;;
            esac
          done < <(
            find rules \
              -maxdepth 1 \
              -type f \
              \( \
                -iname "*.json" \
                -o -iname "*.yaml" \
                -o -iname "*.yml" \
              \) \
              -print0 \
              | sort -z
          )

          rm -f compile_yaml.py

          if [ "$FOUND" -eq 0 ]; then
            echo "::warning::rules/ 中没有找到规则文件"
          fi

          echo "生成文件："
          find output -maxdepth 1 -type f -print | sort || true

          if [ "$HAS_ERROR" -ne 0 ]; then
            echo "::error::至少有一个规则文件编译失败"
            exit 1
          fi

      - name: Commit changes
        if: ${{ success() }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A rules/ output/

          if git diff --cached --quiet; then
            echo "没有需要提交的修改"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_NAME" ]]; then
            git commit -m "Update rule: $INPUT_NAME"
          else
            git commit -m "Auto update rules"
          fi

          git push