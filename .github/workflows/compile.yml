name: 编译规则集

on:
  workflow_dispatch:
    inputs:
      rule_url:
        description: "可选 新规则链接（JSON/YAML）"
        required: false
        type: string

      rule_name:
        description: "可选 规则名称（不含扩展名）"
        required: false
        type: string

      rule_format:
        description: "规则格式（json→srs / yaml→mrs）"
        required: false
        default: "json"
        type: choice
        options:
          - json
          - yaml

      rule_type:
        description: "YAML 规则类型（仅 yaml 时有效）"
        required: false
        default: "domain"
        type: choice
        options:
          - domain
          - ipcidr
          - classical

  schedule:
    - cron: "0 0 * * *"

  push:
    paths:
      - "rules/**"

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest

    env:
      EVENT_NAME: ${{ github.event_name }}
      INPUT_URL: ${{ github.event.inputs.rule_url }}
      INPUT_NAME: ${{ github.event.inputs.rule_name }}
      INPUT_FORMAT: ${{ github.event.inputs.rule_format || 'json' }}
      INPUT_TYPE: ${{ github.event.inputs.rule_type || 'domain' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update -q

          sudo apt-get install -y \
            jq \
            curl \
            wget \
            git \
            python3-yaml

          mkdir -p rules output

      # ---------------------------------------------------------------------
      # 更新 rules/sources.json
      # ---------------------------------------------------------------------
      - name: Update sources.json
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.rule_url != '' }}
        run: |
          set -e

          if [ ! -f "rules/sources.json" ]; then
            echo "[]" > rules/sources.json
          fi

          if [ -z "$INPUT_NAME" ]; then
            echo "::error::请同时填写规则名称"
            exit 1
          fi

          normalize_url() {
            local url="$1"

            if [[ "$url" =~ ^https://github\.com/([^/]+)/([^/]+)/blob/(.+)$ ]]; then
              echo "https://raw.githubusercontent.com/${BASH_REMATCH[1]}/${BASH_REMATCH[2]}/${BASH_REMATCH[3]}"
            elif [[ "$url" =~ ^https://github\.com/([^/]+)/([^/]+)/raw/(.+)$ ]]; then
              echo "https://raw.githubusercontent.com/${BASH_REMATCH[1]}/${BASH_REMATCH[2]}/${BASH_REMATCH[3]}"
            else
              echo "$url"
            fi
          }

          INPUT_URL="$(normalize_url "$INPUT_URL")"

          echo "规则名称: $INPUT_NAME"
          echo "规则地址: $INPUT_URL"
          echo "规则格式: $INPUT_FORMAT"
          echo "规则类型: $INPUT_TYPE"

          build_entry() {
            if [ "$INPUT_FORMAT" = "yaml" ]; then
              jq -n \
                --arg n "$INPUT_NAME" \
                --arg u "$INPUT_URL" \
                --arg fmt "$INPUT_FORMAT" \
                --arg t "$INPUT_TYPE" \
                '{
                  name: $n,
                  url: $u,
                  format: $fmt,
                  type: $t
                }'
            else
              jq -n \
                --arg n "$INPUT_NAME" \
                --arg u "$INPUT_URL" \
                --arg fmt "$INPUT_FORMAT" \
                '{
                  name: $n,
                  url: $u,
                  format: $fmt
                }'
            fi
          }

          ENTRY="$(build_entry)"

          EXISTS="$(
            jq --arg n "$INPUT_NAME" \
              'any(.[]; .name == $n)' \
              rules/sources.json
          )"

          if [ "$EXISTS" = "true" ]; then
            jq \
              --arg n "$INPUT_NAME" \
              --argjson e "$ENTRY" \
              'map(if .name == $n then $e else . end)' \
              rules/sources.json \
              > rules/sources.json.tmp
          else
            jq \
              --argjson e "$ENTRY" \
              '. += [$e]' \
              rules/sources.json \
              > rules/sources.json.tmp
          fi

          mv rules/sources.json.tmp rules/sources.json

          echo "sources.json 更新完成"

      # ---------------------------------------------------------------------
      # 下载 sources.json 中登记的远程规则
      # ---------------------------------------------------------------------
      - name: Download rules
        run: |
          set -e

          mkdir -p rules output

          if [ ! -f "rules/sources.json" ]; then
            echo "rules/sources.json 不存在，跳过远程规则下载"
            exit 0
          fi

          normalize_url() {
            local url="$1"

            if [[ "$url" =~ ^https://github\.com/([^/]+)/([^/]+)/blob/(.+)$ ]]; then
              echo "https://raw.githubusercontent.com/${BASH_REMATCH[1]}/${BASH_REMATCH[2]}/${BASH_REMATCH[3]}"
            elif [[ "$url" =~ ^https://github\.com/([^/]+)/([^/]+)/raw/(.+)$ ]]; then
              echo "https://raw.githubusercontent.com/${BASH_REMATCH[1]}/${BASH_REMATCH[2]}/${BASH_REMATCH[3]}"
            else
              echo "$url"
            fi
          }

          COUNT="$(jq 'length' rules/sources.json)"

          if [ "$COUNT" -eq 0 ]; then
            echo "sources.json 为空，跳过远程规则下载"
            exit 0
          fi

          while IFS= read -r item; do
            name="$(jq -r '.name' <<< "$item")"
            url="$(jq -r '.url' <<< "$item")"
            fmt="$(jq -r '.format // "json"' <<< "$item")"

            case "$fmt" in
              json|yaml|yml)
                ;;
              *)
                echo "::warning::跳过未知格式: $name ($fmt)"
                continue
                ;;
            esac

            url="$(normalize_url "$url")"

            echo "正在下载: rules/${name}.${fmt}"
            echo "地址: $url"

            if ! curl -fsSL \
              --retry 3 \
              --connect-timeout 20 \
              --max-time 120 \
              "$url" \
              -o "rules/${name}.${fmt}"; then
              echo "::warning::下载失败: $name ($url)"
              continue
            fi

            if [ ! -s "rules/${name}.${fmt}" ]; then
              echo "::error::$name 下载结果为空文件"
              exit 1
            fi

            if head -c 500 "rules/${name}.${fmt}" | grep -Eiq \
              '<!DOCTYPE html|<html|<head|access denied|404: not found'; then
              echo "::error::$name 下载到的是网页，而不是规则文件"
              echo "::error::请检查是否使用 raw 链接: $url"
              exit 1
            fi

            echo "下载完成: rules/${name}.${fmt}"
          done < <(jq -c '.[]' rules/sources.json)

      # ---------------------------------------------------------------------
      # 获取并下载 sing-box
      # ---------------------------------------------------------------------
      - name: Download sing-box
        run: |
          set -e

          get_latest_stable_tag() {
            local repo="$1"

            git ls-remote --tags --refs \
              "https://github.com/${repo}.git" \
              | sed 's#^.*/##' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n 1
          }

          TAG="$(get_latest_stable_tag "SagerNet/sing-box")"

          if [ -z "$TAG" ]; then
            echo "::error::无法获取 sing-box 最新稳定版本"
            exit 1
          fi

          VER="${TAG#v}"

          echo "sing-box tag: $TAG"
          echo "sing-box version: $VER"

          ARCHIVE="sing-box-${VER}-linux-amd64.tar.gz"
          URL="https://github.com/SagerNet/sing-box/releases/download/${TAG}/${ARCHIVE}"

          rm -f "$ARCHIVE"
          rm -rf "sing-box-${VER}"

          curl -fL \
            --retry 3 \
            --connect-timeout 30 \
            --max-time 180 \
            -o "$ARCHIVE" \
            "$URL"

          if [ ! -s "$ARCHIVE" ]; then
            echo "::error::sing-box 下载结果为空"
            exit 1
          fi

          tar -xzf "$ARCHIVE"

          if [ ! -f "sing-box-${VER}/sing-box" ]; then
            echo "::error::sing-box 解压后未找到可执行文件"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          sudo install -m 0755 \
            "sing-box-${VER}/sing-box" \
            /usr/local/bin/sing-box

          sing-box version

      # ---------------------------------------------------------------------
      # 获取并下载 mihomo
      # ---------------------------------------------------------------------
      - name: Download mihomo
        run: |
          set -e

          get_latest_stable_tag() {
            local repo="$1"

            git ls-remote --tags --refs \
              "https://github.com/${repo}.git" \
              | sed 's#^.*/##' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n 1
          }

          TAG="$(get_latest_stable_tag "MetaCubeX/mihomo")"

          if [ -z "$TAG" ]; then
            echo "::error::无法获取 mihomo 最新稳定版本"
            exit 1
          fi

          echo "mihomo tag: $TAG"

          FILE="mihomo-linux-amd64-${TAG}.gz"
          URL="https://github.com/MetaCubeX/mihomo/releases/download/${TAG}/${FILE}"

          rm -f "$FILE"
          rm -f "mihomo-linux-amd64-${TAG}"

          curl -fL \
            --retry 3 \
            --connect-timeout 30 \
            --max-time 180 \
            -o "$FILE" \
            "$URL"

          if [ ! -s "$FILE" ]; then
            echo "::error::mihomo 下载结果为空"
            exit 1
          fi

          gzip -d "$FILE"

          if [ ! -f "mihomo-linux-amd64-${TAG}" ]; then
            echo "::error::mihomo 解压后未找到可执行文件"
            ls -la
            exit 1
          fi

          sudo install -m 0755 \
            "mihomo-linux-amd64-${TAG}" \
            /usr/local/bin/mihomo

          mihomo -v

      # ---------------------------------------------------------------------
      # 编译规则
      # ---------------------------------------------------------------------
      - name: Compile rules
        run: |
          set -e

          mkdir -p output

          HAS_ERROR=0

          cat > compile_yaml.py <<'PYEOF'
          import os
          import re
          import subprocess
          import sys
          import yaml

          name, src, requested_type, outdir = sys.argv[1:5]

          with open(src, "r", encoding="utf-8") as f:
              data = yaml.safe_load(f) or {}

          if isinstance(data, dict):
              payload = data.get("payload") or []
          elif isinstance(data, list):
              payload = data
          else:
              payload = []

          payload = [
              str(item).strip()
              for item in payload
              if str(item).strip()
          ]

          domain_exact_re = re.compile(
              r"^DOMAIN,([^,]+)$",
              re.IGNORECASE
          )

          domain_suffix_re = re.compile(
              r"^DOMAIN-SUFFIX,([^,]+)$",
              re.IGNORECASE
          )

          ipcidr_re = re.compile(
              r"^(IP-CIDR|IP-CIDR6),([^,]+)(,no-resolve)?$",
              re.IGNORECASE
          )

          mrs_domain = []
          mrs_ipcidr = []
          classical_only = []

          for line in payload:
              match = domain_exact_re.match(line)

              if match:
                  mrs_domain.append(match.group(1))
                  continue

              match = domain_suffix_re.match(line)

              if match:
                  mrs_domain.append("+." + match.group(1))
                  continue

              match = ipcidr_re.match(line)

              if match:
                  mrs_ipcidr.append(match.group(2))
                  continue

              # DOMAIN-KEYWORD、DOMAIN-REGEX、IP-ASN 等规则
              # 无法转换成 domain/ipcidr MRS，保留为 classical YAML。
              classical_only.append(line)

          def convert(lines, behavior, destination):
              if not lines:
                  return True

              temp_yaml = destination + ".source.yaml"

              with open(temp_yaml, "w", encoding="utf-8") as f:
                  yaml.safe_dump(
                      {"payload": lines},
                      f,
                      allow_unicode=True,
                      sort_keys=False
                  )

              result = subprocess.run(
                  [
                      "mihomo",
                      "convert-ruleset",
                      behavior,
                      "yaml",
                      temp_yaml,
                      destination
                  ],
                  capture_output=True,
                  text=True
              )

              try:
                  os.remove(temp_yaml)
              except OSError:
                  pass

              if result.returncode != 0:
                  error = result.stderr.strip()[:500]

                  print(
                      f"::error::[{name}] "
                      f"{behavior} MRS 转换失败: {error}",
                      file=sys.stderr
                  )

                  if result.stdout.strip():
                      print(result.stdout.strip()[:500], file=sys.stderr)

                  return False

              print(
                  f"已生成 {os.path.basename(destination)} "
                  f"({len(lines)} 条)"
              )

              return True

          ok = True

          if mrs_domain:
              domain_path = os.path.join(
                  outdir,
                  f"{name}.mrs"
              )

              ok = convert(
                  mrs_domain,
                  "domain",
                  domain_path
              ) and ok

          if mrs_ipcidr:
              ipcidr_path = os.path.join(
                  outdir,
                  f"{name}-ipcidr.mrs"
              )

              ok = convert(
                  mrs_ipcidr,
                  "ipcidr",
                  ipcidr_path
              ) and ok

          if classical_only:
              classical_path = os.path.join(
                  outdir,
                  f"{name}-classical.yaml"
              )

              with open(classical_path, "w", encoding="utf-8") as f:
                  yaml.safe_dump(
                      {"payload": classical_only},
                      f,
                      allow_unicode=True,
                      sort_keys=False
                  )

              print(
                  f"::warning::[{name}] "
                  f"{len(classical_only)} 条规则无法转换为 MRS，"
                  f"已保存为 {name}-classical.yaml"
              )

          if not mrs_domain and not mrs_ipcidr and not classical_only:
              print(
                  f"::error::[{name}] 没有找到有效规则",
                  file=sys.stderr
              )
              ok = False

          sys.exit(0 if ok else 1)
          PYEOF

          echo "开始扫描 rules/ 目录中的规则文件"

          FOUND=0

          while IFS= read -r -d '' src; do
            FOUND=1

            filename="$(basename "$src")"
            extension="${filename##*.}"
            name="${filename%.*}"

            case "$filename" in
              sources.json)
                echo "跳过配置文件: $filename"
                continue
                ;;
            esac

            case "$extension" in
              json)
                destination="output/${name}.srs"

                echo "正在编译 JSON: ${filename}"

                rm -f "$destination"

                if sing-box rule-set compile \
                  --output "$destination" \
                  "$src"; then
                  echo "编译成功: ${destination}"
                else
                  echo "::error::JSON 编译失败: ${filename}"
                  HAS_ERROR=1
                fi
                ;;

              yaml|yml)
                echo "正在编译 YAML: ${filename}"

                rm -f \
                  "output/${name}.mrs" \
                  "output/${name}-ipcidr.mrs" \
                  "output/${name}-classical.yaml"

                if python3 compile_yaml.py \
                  "$name" \
                  "$src" \
                  "domain" \
                  "output"; then
                  echo "编译成功: ${filename}"
                else
                  echo "::error::YAML 编译失败: ${filename}"
                  HAS_ERROR=1
                fi
                ;;

              *)
                echo "跳过不支持的文件: ${filename}"
                ;;
            esac
          done < <(
            find rules \
              -maxdepth 1 \
              -type f \
              \( \
                -name "*.json" \
                -o -name "*.yaml" \
                -o -name "*.yml" \
              \) \
              -print0 \
              | sort -z
          )

          if [ "$FOUND" -eq 0 ]; then
            echo "::warning::rules/ 目录中没有找到 JSON 或 YAML 规则文件"
          fi

          echo
          echo "当前生成的文件："

          if find output -maxdepth 1 -type f -print -quit | grep -q .; then
            find output \
              -maxdepth 1 \
              -type f \
              -print \
              | sort
          else
            echo "output/ 目录为空"
          fi

          if [ "$HAS_ERROR" -ne 0 ]; then
            echo "::error::至少有一个规则文件编译失败"
            exit 1
          fi

          echo "全部规则编译完成"

      # ---------------------------------------------------------------------
      # 提交编译结果
      # ---------------------------------------------------------------------
      - name: Commit changes
        if: always()
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A rules/ output/

          if git diff --cached --quiet; then
            echo "没有需要提交的修改"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_NAME" ]]; then
            git commit -m "Update rule: $INPUT_NAME"
          else
            git commit -m "Auto update rules"
          fi

          git push